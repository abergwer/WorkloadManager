version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: workload-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobsdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workload-network

  # WorkloadManager Web Application
  workloadmanager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workload-app
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=jobsdb;Username=postgres;Password=postgres"
    ports:
      - "5000:80"
      - "5001:443"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./WorkloadManager:/app/src:ro
    networks:
      - workload-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  workload-network:
    driver: bridge
